language: ko-KR

reviews:
  profile: assertive

  request_changes_workflow: true

  high_level_summary: true
  changed_files_summary: true
  estimate_code_review_effort: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "release-be"
      - "release-fe"
      - "release-app"

  path_instructions:

    # ==================================================
    # 공통 리뷰 규칙
    # ==================================================
    - path: "**/*"
      instructions: |
        사소한 스타일보다 실제 동작 오류, 팀 컨벤션 위반, 유지보수 위험을 우선한다.

        모든 리뷰 코멘트는 다음 중 하나로 시작한다.

        [필수]: 기능 오류, 보안 문제, 데이터 정합성 문제, 명시적인 팀 컨벤션 위반
        [권장]: 테스트 누락, 유지보수 위험, 잠재적인 장애 가능성, 책임이 모호한 구조
        [참고]: 가독성, 네이밍, 작은 구조 개선

        팀이 합의하지 않은 설계 선택은 정답처럼 단정하지 않고 질문한다.
        컨벤션에 없는 새로운 스타일 규칙을 만들지 않는다.

    # ==================================================
    # Backend
    # ==================================================
    - path: "BE/**/*.java"
      instructions: |
        기본 계층은 Controller → Service → Repository → Dao / Mapper 이다.

        Controller가 Dao/Mapper를 직접 호출하면 [필수]로 지적한다.
        Domain이 persistence Entity를 참조하면 [필수]로 지적한다.
        Dao가 Domain 객체를 직접 조립하면 [필수]로 지적한다.
        Domain과 persistence Entity를 같은 객체로 사용하면 [필수]로 지적한다.

        요청 DTO는 Bean Validation으로 검증하고 필요한 경우 @Valid를 사용한다.
        Controller에서 예외를 try-catch하여 오류 응답을 직접 만들지 않는다.

        트랜잭션은 Service 메서드 단위로 설정한다.
        순수 조회 Service 메서드는 @Transactional(readOnly = true)를 사용한다.

        Domain 또는 Service에서 HttpStatus를 직접 사용하면 [필수]로 지적한다.
        Lombok을 새로 사용하면 [필수]로 지적한다.

    # ==================================================
    # ProblemDetail / Exception
    # ==================================================
    - path: "BE/**/*Exception*.java"
      instructions: |
        서버 내부 오류 정보와 클라이언트 공개 오류 정보를 분리한다.

        애플리케이션 예외는 자신의 ProblemType을 제공한다.
        ProblemType은 id, status, clientMessage를 관리한다.

        ProblemDetail.detail에는 ProblemType.clientMessage를 사용한다.
        ex.getMessage()를 ProblemDetail.detail에 사용하면 [필수]로 지적한다.

        내부 예외 메시지, stack trace, SQL 원문,
        외부 API의 민감한 응답이 클라이언트에게 노출되면 [필수]로 지적한다.

        로그에 비밀번호, 인증 토큰, 세션 ID, 결제 정보,
        개인정보가 포함되면 [필수]로 지적한다.

    - path: "BE/**/*ExceptionHandler*.java"
      instructions: |
        ResponseEntityExceptionHandler 처리 흐름을 유지한다.
        Spring MVC 예외 처리에서 super.handleExceptionInternal(...) 호출을 제거하지 않는다.

        실제 HTTP status와 ProblemDetail.status가 일치해야 한다.
        ProblemDetail.type은 ProblemType의 id를 기반으로 한 URI를 사용한다.
        ProblemDetail.detail은 ProblemType.clientMessage를 사용한다.

        예상 가능한 4xx는 WARN으로 기록한다.
        예상하지 못한 5xx는 ERROR로 기록하고 원인 예외와 stack trace를 남긴다.

    # ==================================================
    # Test
    # ==================================================
    - path: "BE/src/test/**/*.java"
      instructions: |
        테스트 메서드명은 lowerCamelCase의
        should[ExpectedBehavior]When[Condition] 형식을 사용한다.

        @DisplayName은 자연스러운 한국어로 작성한다.
        예외 테스트는 예외 타입뿐 아니라 메시지도 검증한다.

        ProblemDetail 변경 시 다음을 확인한다.
        - HTTP status와 ProblemDetail.status가 일치한다.
        - type이 올바른 ProblemType URI다.
        - detail이 ProblemType.clientMessage다.
        - 내부 예외 메시지가 응답에 포함되지 않는다.

        단순히 coverage 수치를 높이기 위한 의미 없는 테스트는 권장하지 않는다.

  # ====================================================
  # Merge 전 검사
  # ====================================================
  pre_merge_checks:

    title:
      mode: warning
      requirements: |
        release-* 브랜치를 대상으로 하는 작업 PR은
        제목이 [TSK-###] 형식의 Task ID로 시작해야 한다.

        예:
        [TSK-201] 할 일 완료 API 구현

        release-* → main PR은 제외한다.

    custom_checks:

      - name: "Notion TASK 연결"
        mode: warning
        instructions: |
          release-be, release-fe, release-app을 대상으로 하는 작업 PR은
          PR 본문의 TASK 영역에 Notion Task URL이 있어야 한다.

          release-* → main PR은 제외한다.

      - name: "PR 크기"
        mode: warning
        instructions: |
          통과 기준은 핵심 변경 코드 200줄 이하이고
          핵심 변경 파일 5개 이하이다.

          핵심 변경 코드는 PR diff의 추가 줄 수와 삭제 줄 수의 합으로 계산한다.
          파일 이름 변경은 변경 파일 1개로 계산하고,
          코드 변경이 없는 순수 파일 이름 변경은 변경 코드 줄 수에 포함하지 않는다.
          테스트 코드는 핵심 변경 코드와 변경 파일 수에 포함한다.

          핵심 변경 코드가 350줄을 초과하거나
          핵심 변경 파일이 10개를 초과하면 PR 분리를 권고한다.

          핵심 변경 코드가 201~350줄이거나
          핵심 변경 파일이 6~10개인 경우에는 경고한다.

      - name: "Backend 계층 규칙"
        mode: warning
        instructions: |
          BE 변경에서 다음을 확인한다.

          - Controller → Dao/Mapper 직접 호출
          - Domain → Entity 의존
          - Dao가 Domain 직접 조립
          - Domain/Service에서 HttpStatus 사용

          발견되면 merge 전에 확인이 필요함을 알린다.

      - name: "ProblemDetail 내부 정보 노출"
        mode: error
        instructions: |
          다음 문제가 하나라도 존재하면 실패한다.

          - ex.getMessage()를 ProblemDetail.detail로 반환
          - stack trace를 API 응답에 반환
          - SQL 오류 원문을 API 응답에 반환
          - 내부 Exception class 이름을 API 응답에 반환
          - 외부 API의 민감한 원문을 API 응답에 반환
