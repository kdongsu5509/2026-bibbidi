name: Android Release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Android AAB
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @bibbidi/app typecheck

      - name: Lint
        run: pnpm --filter @bibbidi/app lint

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "Missing required Android signing secret: $value" >&2
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/bibbidi-upload.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/bibbidi-upload.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/bibbidi-upload.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > APP/android/keystore.properties

      - name: Build signed release AAB
        working-directory: APP/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon

      - name: Verify release outputs
        shell: bash
        run: |
          test -f APP/android/app/build/outputs/bundle/release/app-release.aab
          test -f APP/android/app/build/outputs/mapping/release/mapping.txt
          test -f APP/android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          jarsigner -verify -strict \
            APP/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bibbidi-android-release-${{ github.run_number }}
          path: |
            APP/android/app/build/outputs/bundle/release/app-release.aab
            APP/android/app/build/outputs/mapping/release/mapping.txt
            APP/android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: error
          retention-days: 14
